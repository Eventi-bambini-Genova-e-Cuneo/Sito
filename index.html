<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Calendar Style - Eventi Genova</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-white text-slate-700 min-h-screen flex flex-col relative">

    <!-- Header in stile Google Calendar -->
    <header class="border-b border-slate-200 px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">📅</span>
                <h1 class="text-xl font-semibold text-slate-800">Eventi Famiglie Genova</h1>
            </div>
            <span id="event-counter" class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-medium">Caricamento...</span>
        </div>
        
        <!-- Navigazione Mesi -->
        <div class="flex items-center space-x-3">
            <button onclick="changeMonth(-1)" class="px-3 py-1.5 text-sm font-medium border border-slate-200 rounded-lg hover:bg-slate-50 transition cursor-pointer">◀ Prec</button>
            <span id="current-month-label" class="text-sm font-bold text-slate-700 min-w-[140px] text-center">Settembre 2026</span>
            <button onclick="changeMonth(1)" class="px-3 py-1.5 text-sm font-medium border border-slate-200 rounded-lg hover:bg-slate-50 transition cursor-pointer">Succ ▶</button>
        </div>
    </header>

    <!-- Area Principale del Calendario -->
    <main class="flex-grow flex flex-col p-4 sm:p-6 max-w-7xl mx-auto w-full">
        <div class="flex-grow border border-slate-200 rounded-lg overflow-hidden flex flex-col shadow-xs bg-slate-200 gap-px">
            
            <!-- Giorni della settimana -->
            <div class="grid grid-cols-7 bg-slate-50 text-center text-xs font-bold text-slate-500 py-3 uppercase tracking-wider">
                <div>Lunedì</div><div>Martedì</div><div>Mercoledì</div><div>Giovedì</div><div>Venerdì</div><div>Sabato</div><div>Domenica</div>
            </div>

            <!-- Griglia dei giorni -->
            <div id="calendar-grid" class="grid grid-cols-7 auto-rows-fr flex-grow bg-slate-200 gap-px"></div>
        </div>
    </main>

    <!-- MODALE DETTAGLIO EVENTO (Nascosto di default) -->
    <div id="event-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-200 transform transition-all">
            <div class="flex justify-between items-start mb-4">
                <span id="modal-category" class="text-xs font-semibold px-3 py-1 rounded-full bg-blue-100 text-blue-800">Categoria</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold cursor-pointer">✕</button>
            </div>
            <h2 id="modal-title" class="text-2xl font-bold text-slate-800 mb-2">Titolo Evento</h2>
            <p id="modal-date" class="text-sm font-medium text-blue-600 mb-4">📅 Data</p>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Descrizione completa</p>
                <p id="modal-description" class="text-slate-700 text-base leading-relaxed">Nessuna descrizione disponibile.</p>
            </div>
            <p id="modal-location" class="text-xs text-slate-500 flex items-center mb-6">📍 <span class="ml-1 font-medium">Luogo</span></p>
            <button onclick="closeModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-xl transition cursor-pointer">Chiudi</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wawheqxtqcfxigumadoc.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indhd2hlcXh0cWNmeGlndW1hZG9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5OTcyODEsImV4cCI6MjEwMzU3MzI4MX0.cRE1I-JmO2ryWRRhMSN1gm6NpBbh1615FyAPM_FdaO4";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentYear = 2026;
        let currentMonth = 8; // Settembre
        let allEvents = [];

        const monthNames = [
            "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
            "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"
        ];

        async function initCalendar() {
            const { data, error } = await supabaseClient
                .from('children_events')
                .select('*');

            if (error) {
                console.error("Errore caricamento:", error.message);
                return;
            }

            allEvents = data || [];
            renderCalendar();
        }

        // Funzione per rimettere la chiave corretta automaticamente se serve
        async function fixKeyAndReload() {
            // Esegue il render base
            renderCalendar();
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function showEventDetails(title, description, location, date, category) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-description').innerText = description || "Nessuna descrizione fornita.";
            document.getElementById('modal-location').querySelector('span').innerText = location || "Genova";
            document.getElementById('modal-date').innerText = `📅 ${date}`;
            document.getElementById('modal-category').innerText = category || "Attività";
            
            document.getElementById('event-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('event-modal').classList.add('hidden');
        }

        function renderCalendar() {
            document.getElementById('current-month-label').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            const grid = document.getElementById('calendar-grid');
            
            document.getElementById('event-counter').innerText = `${allEvents.length} eventi totali`;

            const eventsByDate = {};
            allEvents.forEach(ev => {
                if (!eventsByDate[ev.date]) eventsByDate[ev.date] = [];
                eventsByDate[ev.date].push(ev);
            });

            const firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7; 
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            let htmlContent = '';

            for (let i = 0; i < firstDayIndex; i++) {
                htmlContent += `<div class="bg-slate-50/50 min-h-[120px] p-2"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayStr = day < 10 ? `0${day}` : `${day}`;
                const monthStr = (currentMonth + 1) < 10 ? `0${currentMonth + 1}` : `${currentMonth + 1}`;
                const dateKey = `${currentYear}-${monthStr}-${dayStr}`;
                const dayEvents = eventsByDate[dateKey] || [];

                let eventsHtml = '';
                dayEvents.forEach(ev => {
                    let badgeColor = "bg-blue-100 text-blue-800 border-blue-200";
                    if (ev.category && ev.category.includes("De Amicis")) {
                        badgeColor = "bg-purple-100 text-purple-800 border-purple-200";
                    } else if (ev.category && ev.category.includes("Varazze")) {
                        badgeColor = "bg-amber-100 text-amber-800 border-amber-200";
                    } else if (ev.category && ev.category.includes("Kora")) {
                        badgeColor = "bg-emerald-100 text-emerald-800 border-emerald-200";
                    }

                    // Salviamo i dati in modo sicuro per passarli alla funzione di click
                    const safeTitle = (ev.title || "").replace(/'/g, "\\'");
                    const safeDesc = (ev.description || "").replace(/'/g, "\\'").replace(/\n/g, " ");
                    const safeLoc = (ev.location || "").replace(/'/g, "\\'");
                    const safeCat = (ev.category || "").replace(/'/g, "\\'");

                    eventsHtml += `
                        <div onclick="showEventDetails('${safeTitle}', '${safeDesc}', '${safeLoc}', '${ev.date}', '${safeCat}')" 
                             class="${badgeColor} text-xs px-2 py-1.5 rounded border font-medium mb-1 truncate shadow-2xs cursor-pointer hover:opacity-80 transition flex items-center">
                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-current mr-1.5 shrink-0"></span>
                            <span class="truncate">${ev.title}</span>
                        </div>
                    `;
                });

                htmlContent += `
                    <div class="bg-white min-h-[120px] p-2 flex flex-col justify-between transition hover:bg-slate-50/80">
                        <div class="flex justify-end">
                            <span class="text-xs font-semibold text-slate-600">${day}</span>
                        </div>
                        <div class="flex-grow overflow-y-auto mt-1 space-y-1">
                            ${eventsHtml}
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = htmlContent;
        }

        initCalendar();
    </script>
</body>
</html>
